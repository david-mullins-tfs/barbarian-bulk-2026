name: Build cohesive app icons
on:
  push:
    branches: [design/cohesive-icon-backgrounds]
    paths: [.github/workflows/cohesive-icon-backgrounds.yml, scripts/build_heldkraft_icons.py]
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - run: python scripts/build_heldkraft_icons.py
      - name: Verify dimensions, opacity and distinct background colors
        run: |
          python - <<'PY'
          from PIL import Image
          for directory in ['icons', 'hesperides/icons']:
              for filename, size in [('icon-192.png', 192), ('icon-512.png', 512), ('icon-maskable-512.png', 512), ('apple-touch-icon.png', 180)]:
                  im = Image.open(f'{directory}/{filename}')
                  assert im.size == (size, size) and im.mode == 'RGB'
          a = Image.open('icons/icon-512.png').getpixel((5, 5))
          h = Image.open('hesperides/icons/icon-512.png').getpixel((5, 5))
          assert a[2] > a[1] > a[0] and h[1] > h[0] and h[1] > h[2], (a, h)
          PY
      - run: node hesperides/tests.js && node hesperides/meal-picker.test.js
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png hesperides/icons/icon-192.png hesperides/icons/icon-512.png hesperides/icons/icon-maskable-512.png hesperides/icons/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate navy and green app icons"
            git push origin HEAD:design/cohesive-icon-backgrounds
          fi
