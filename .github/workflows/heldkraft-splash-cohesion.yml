name: Review seamless Heldkraft splash-to-app palettes
on:
  push:
    branches:
      - design/heldkraft-seamless-splash-2026-11-17
    paths:
      - index.html
      - hesperides/index.html
      - sw.js
      - hesperides/sw.js
      - scripts/build_splash_cohesion_review.py
      - splash-cohesion.test.js
      - .github/workflows/heldkraft-splash-cohesion.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare visual QA
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Generate comparison using approved original splash artwork
        run: python scripts/build_splash_cohesion_review.py
      - name: Assert visual and cache coherence
        run: node splash-cohesion.test.js
      - name: Check Hesperides integration
        run: node hesperides/tests.js
      - name: Check meal-picker logic
        run: node hesperides/meal-picker.test.js
      - name: Commit only comparison graphic to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/heldkraft-seamless-splash.png
          if ! git diff --cached --quiet; then
            git commit -m "Add matched splash and app visual comparison"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
