name: Generate Atlas and Hesperides review icons
on:
  push:
    branches:
      - design/atlas-hesperides-identity-2026-11-17
    paths:
      - scripts/build_heldkraft_icons.py
      - hesperides/app.js
      - hesperides/meal-picker.test.js
      - .github/workflows/heldkraft-identity-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build PWA and iOS icon PNGs from approved borderless splash art
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python scripts/build_heldkraft_icons.py
          test -s icons/apple-touch-icon.png
          test -s hesperides/icons/apple-touch-icon.png
      - name: Commit icon previews to this design branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png icons/apple-touch-icon.png
          git add hesperides/icons/icon-192.png hesperides/icons/icon-512.png hesperides/icons/icon-maskable-512.png hesperides/icons/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate title-only Atlas and Hesperides icon assets"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Hesperides integration regression checks
        run: node hesperides/tests.js
      - name: Meal picker regression checks
        if: always()
        shell: bash
        run: |
          set +e
          node hesperides/meal-picker.test.js > meal-picker-failure.txt 2>&1
          result=$?
          cat meal-picker-failure.txt
          if [ "$result" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add meal-picker-failure.txt
            if ! git diff --cached --quiet; then
              git commit -m "Capture failing meal-picker test diagnostics"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            rm meal-picker-failure.txt
          fi
          exit "$result"
