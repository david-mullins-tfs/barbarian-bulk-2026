name: Verify transparent Heldkraft header emblems
on:
  push:
    branches:
      - fix/transparent-header-emblems-2026-11-18
    paths:
      - index.html
      - hesperides/index.html
      - styles.css
      - hesperides/styles.css
      - sw.js
      - hesperides/sw.js
      - atlas-header-icon.test.js
      - .github/workflows/atlas-header-icon.yml
  pull_request:
    paths:
      - index.html
      - hesperides/index.html
      - styles.css
      - hesperides/styles.css
      - sw.js
      - hesperides/sw.js
      - atlas-header-icon.test.js
      - .github/workflows/atlas-header-icon.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both header emblems and mobile layout
        run: node atlas-header-icon.test.js
      - name: Check Hesperides integration
        run: node hesperides/tests.js
      - name: Check Hesperides meal picker
        run: node hesperides/meal-picker.test.js
