<html lang="en">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Atlas · Heldkraft Performance Research</title>
  <style id="heldkraft-launch-style">
  /* Heldkraft launch sequence — uses the approved local icon artwork, not a replacement image. */
  .hk-launch{position:fixed;inset:0;z-index:10000;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse 70% 44% at 50% 38%,rgba(197,154,89,.14),transparent 80%),#151B23;color:#E8DCC7;display:flex;align-items:center;justify-content:center;padding:calc(36px + env(safe-area-inset-top)) 18px calc(54px + env(safe-area-inset-bottom));text-align:center;isolation:isolate;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
  .hk-launch--leaving{opacity:0;visibility:hidden;pointer-events:none}
  .hk-launch-inner{width:100%;max-width:560px;margin:auto;transform:translateY(-1vh)}
  .hk-launch-studio{font:800 10px/1.45 Inter,system-ui,sans-serif;letter-spacing:.25em;color:#D6AF74;margin-bottom:14px}
  .hk-launch-art{width:min(84vw,340px);height:min(67vw,260px);max-height:260px;overflow:hidden;margin:0 auto 8px;position:relative}
  .hk-launch-art img{display:block;width:100%;height:auto;mix-blend-mode:screen;filter:brightness(1.06) saturate(.94);clip-path:inset(0 0 38% 0);-webkit-mask-image:radial-gradient(ellipse 43% 38% at 50% 30%,#000 37%,rgba(0,0,0,.88) 60%,transparent 98%);mask-image:radial-gradient(ellipse 43% 38% at 50% 30%,#000 37%,rgba(0,0,0,.88) 60%,transparent 98%)}
  .hk-launch-title{font:700 clamp(43px, 11.5vw, 64px)/1.05 Georgia,'Times New Roman',serif;letter-spacing:.19em;margin:0 0 9px;color:#F0DCB7;text-shadow:0 0 27px rgba(210,157,83,.11)}
  .hk-launch-tagline{font:italic 24px/1.35 Georgia,'Times New Roman',serif;color:#E5B977;margin:0 0 17px}
  .hk-launch-subtitle{font:700 11px/1.5 Inter,system-ui,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:#BFC4C4;margin:0}
  .hk-launch-skip{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border:1px solid rgba(232,220,199,.28);border-radius:24px;padding:8px 14px;font:600 12px Inter,system-ui,sans-serif;color:#D8C9AF;background:rgba(0,0,0,.14);cursor:pointer}
  .hk-launch-skip:focus-visible{outline:2px solid #E5B977;outline-offset:3px}
  @media(max-width:380px){.hk-launch-studio{font-size:8px;letter-spacing:.2em}.hk-launch-art{width:min(87vw,300px);height:min(68vw,242px)}.hk-launch-tagline{font-size:21px}.hk-launch-subtitle{font-size:10px}}
  @media(prefers-reduced-motion:reduce){.hk-launch{transition:none}}
  
  
  /* Borderless splash art revision: use the uploaded full-resolution Atlas / golden apple, not the framed Home Screen icon. */
  .hk-launch{background:#080E17}
  .hk-launch-inner{transform:translateY(-1vh)}
  .hk-launch-art{width:min(94vw,460px);height:min(56vh,475px);height:min(56dvh,475px);max-height:none;overflow:visible;margin:0 auto 12px}
  .hk-launch-art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center;clip-path:none;mix-blend-mode:normal;filter:none;-webkit-mask-image:none;mask-image:none}
  @media(max-height:700px){.hk-launch-art{height:min(49vh,365px);height:min(49dvh,365px)}.hk-launch-studio{margin-bottom:9px}}
  @media(max-height:600px){.hk-launch-art{height:min(42vh,310px);height:min(42dvh,310px)}}
  
  
  /* Coordinated launch treatment: retain approved borderless sculpture. */
  .hk-launch{background:radial-gradient(ellipse 58% 41% at 50% 37%,rgba(16,34,56,.35),transparent 87%),#000}
  .hk-launch-art img{mix-blend-mode:screen}
  .hk-launch-title{color:#F0DEBE}
  .hk-launch-studio,.hk-launch-tagline{color:#D2AD70}
  .hk-launch-subtitle{color:#B3C0CE}
  .hk-launch-skip:focus-visible{outline-color:#D2AD70}

  /* Cohesive launch refinement: match Atlas app surfaces, with a faint steel-blue light. */
  .hk-launch{
    background:
      radial-gradient(ellipse 67% 48% at 50% 40%,rgba(99,136,158,.21) 0%,rgba(42,71,93,.12) 39%,rgba(8,14,23,0) 77%),
      linear-gradient(180deg,#080E17 0%,#101C2A 48%,#080E17 100%);
    color:#EEE3D0;
  }
  .hk-launch-art img{mix-blend-mode:normal;filter:none}
  .hk-launch-title{color:#F0DEBE;text-shadow:0 0 24px rgba(210,173,112,.12)}
  .hk-launch-studio,.hk-launch-tagline{color:#D2AD70}
  .hk-launch-subtitle{color:#B3C0CE}

  </style>
  <link rel="preload" href="./icons/atlas-launch-cutout.png?v=alpha1" as="image" type="image/png">
</head>
<body>
  <section class="hk-launch hk-launch--atlas" id="hkLaunchSplash" role="status" aria-label="ATLAS launching">
    <div class="hk-launch-inner">
      <div class="hk-launch-studio">HELDKRAFT PERFORMANCE RESEARCH</div>
      <div class="hk-launch-art" aria-hidden="true"><img src="./icons/atlas-launch-cutout.png?v=alpha1" alt="" fetchpriority="high"></div>
      <h2 class="hk-launch-title">ATLAS</h2>
      <p class="hk-launch-tagline">Lift the World.</p>
      <p class="hk-launch-subtitle">Strength, Measured.</p>
    </div>
    <button class="hk-launch-skip" type="button" id="hkLaunchSkip" aria-label="Skip launch screen">Skip</button>
  </section>
  <script>
  (function(){
    'use strict';
    const splash=document.getElementById('hkLaunchSplash');
    const skip=document.getElementById('hkLaunchSkip');
    if(!splash)return;
    let dismissed=false;
    let timer;
    function dismiss(){
      if(dismissed)return;
      dismissed=true;
      splash.classList.add('hk-launch--leaving');
      const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.setTimeout(function(){splash.remove();},reduce?0:490);
    }
    if(skip)skip.addEventListener('click',function(){window.clearTimeout(timer);dismiss();},{once:true});
    timer=window.setTimeout(dismiss,2250);
  })();
  </script>

  <header class="app-header">
    <div class="atlas-header-brand">
      <img class="atlas-header-emblem" src="./icons/icon-192.png?v=icons3" width="44" height="44" alt="" aria-hidden="true">
      <div class="atlas-header-text">
        <div class="eyebrow">HELDKRAFT PERFORMANCE RESEARCH</div>
        <h1>ATLAS <span class="header-program">/ Barbarian Bulk</span></h1>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
  </header>

  <main id="app" class="app-shell"></main>

  <nav class="bottom-nav atlas-four-tabs" aria-label="Main navigation">
    <button data-route="home" class="nav-btn active"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg><small>Workout</small></button>
    <button data-route="exercises" class="nav-btn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v13c3-1 6-1 9 1m0-13c3-2 6-2 9-1v13c-3-1-6-1-9 1m0-13v13"/></svg><small>Exercises</small></button>
    <button data-route="volume" class="nav-btn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 19V12m5 7V6m5 13V9m5 10V3"/></svg><small>Volume</small></button>
    <button data-route="progress" class="nav-btn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 17 6-6 4 3 8-9M15 5h6v6"/></svg><small>Progress</small></button>
  </nav>

  <dialog id="menuDialog" class="menu-dialog">
    <button class="menu-item" data-action="route-progress">📈 Progress</button>
    <button class="menu-item" data-action="route-plates">🧮 Plate Counter</button>
    <button class="menu-item" data-action="route-cardio">🏃 Cardio</button>
    <button class="menu-item" data-action="route-notes">📝 Notes</button>
    <button class="menu-item" data-action="route-library">⚔️ Program Library</button>
    <button class="menu-item" data-action="route-artwork">🖼️ Exercise Gallery</button>
    <button class="menu-item" data-action="route-program">🛠️ Program Editor</button>
    <button class="menu-item" data-action="route-settings">⚙️ Settings</button>
    <a class="menu-item atlas-external-menu" href="./hesperides/">🍏 Open Hesperides ↗</a>
    <button class="menu-item" data-action="export-macros">📂 Export legacy macros</button>
    <button class="menu-item" data-action="route-macros">🗄️ Legacy macro history</button>
    <hr class="menu-separator">
    <button class="menu-item" data-action="export">Export backup</button>
    <label class="menu-item file-item">Import backup<input id="importInput" type="file" accept="application/json" hidden></label>
    <button class="menu-item danger" data-action="reset">Reset all local data</button>
    <button class="menu-item" data-action="close">Close</button>
  </dialog>

  <dialog id="plateDialog" class="menu-dialog plate-dialog"></dialog>
  <dialog id="exerciseDetailDialog" class="menu-dialog atlas-detail-dialog"></dialog>
  <dialog id="noteDialog" class="menu-dialog note-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="restTimerDock" class="rest-dock" aria-live="polite"></div>

</body>
</html>
