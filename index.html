<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151B23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=34.1">
  <title>Atlas · Heldkraft Performance Research</title>
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">HELDKRAFT PERFORMANCE RESEARCH</div>
      <h1>ATLAS <span class="header-program">/ Barbarian Bulk</span></h1>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
  </header>

  <main id="app" class="app-shell"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-route="home" class="nav-btn active"><span>🏋️</span><small>Workout</small></button>
    <button data-route="volume" class="nav-btn"><span>📊</span><small>Volume</small></button>
    <button data-route="macros" class="nav-btn"><span>🥩</span><small>Macros</small></button>
    <button data-route="cardio" class="nav-btn"><span>🏃</span><small>Cardio</small></button>
    <button data-route="notes" class="nav-btn"><span>📝</span><small>Notes</small></button>
  </nav>

  <dialog id="menuDialog" class="menu-dialog">
    <button class="menu-item" data-action="route-progress">📈 Progress</button>
    <button class="menu-item" data-action="route-plates">🧮 Plate Counter</button>
    <button class="menu-item" data-action="route-library">⚔️ Program Library</button>
    <button class="menu-item" data-action="route-program">🛠️ Program Editor</button>
    <button class="menu-item" data-action="route-settings">⚙️ Settings</button>
    <hr class="menu-separator">
    <button class="menu-item" data-action="export">Export backup</button>
    <label class="menu-item file-item">Import backup<input id="importInput" type="file" accept="application/json" hidden></label>
    <button class="menu-item danger" data-action="reset">Reset all local data</button>
    <button class="menu-item" data-action="close">Close</button>
  </dialog>

  <dialog id="plateDialog" class="menu-dialog plate-dialog"></dialog>
  <dialog id="exerciseDetailDialog" class="menu-dialog atlas-detail-dialog"></dialog>
  <dialog id="noteDialog" class="menu-dialog note-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="restTimerDock" class="rest-dock" aria-live="polite"></div>

  <script src="nutrition.js?v=34.1"></script>
  <script src="cardio.js?v=34.1"></script>
  <script src="rest-timer.js?v=34.1"></script>
  <script src="warmup.js?v=34.1"></script>
  <script src="weight-sync.js?v=34.1"></script>
  <script src="volume.js?v=34.1"></script>
  <script src="plate-counter.js?v=34.1"></script>
  <script src="exercise-library.js?v=34.1"></script>
  <script src="atlas-programs.js?v=34.1"></script>
  <script src="app.js?v=34.1" defer></script>
</body>
</html>
